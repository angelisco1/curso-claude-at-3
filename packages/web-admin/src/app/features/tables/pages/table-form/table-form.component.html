<div class="fade-in">
  <div class="page-header">
    <div class="header-back">
      <a [routerLink]="listUrl" class="back-link" aria-label="Volver al listado">
        <lucide-icon name="chevron-left" [size]="18"></lucide-icon>
      </a>
      <h1>{{ pageTitle }}</h1>
    </div>
  </div>

  @if (error()) {
    <div class="alert-error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="card form-card">
    <div class="form-grid">
      <div class="form-group">
        <label for="number">Número de mesa</label>
        <input id="number" type="number" class="form-control" formControlName="number" min="1" step="1" />
        @if (form.controls.number.touched && form.controls.number.invalid) {
          <small class="field-error">Debe ser un entero mayor o igual que 1.</small>
        }
      </div>

      <div class="form-group">
        <label for="capacity">Capacidad (comensales)</label>
        <input id="capacity" type="number" class="form-control" formControlName="capacity" min="1" step="1" />
        @if (form.controls.capacity.touched && form.controls.capacity.invalid) {
          <small class="field-error">Debe ser un entero mayor o igual que 1.</small>
        }
      </div>

      <div class="form-group">
        <label for="description">Descripción (opcional)</label>
        <input id="description" type="text" class="form-control" formControlName="description" placeholder="Junto a la ventana" />
      </div>

      <div class="form-group">
        <label for="status">Estado</label>
        <select id="status" class="form-control" formControlName="status">
          @for (s of statuses; track s) {
            <option [value]="s">{{ s }}</option>
          }
        </select>
      </div>
    </div>

    <div class="form-actions">
      <a [routerLink]="listUrl" class="btn btn-secondary">Cancelar</a>
      <button type="submit" class="btn btn-primary" [disabled]="loading()">
        @if (loading()) {
          Guardando...
        } @else {
          Guardar
        }
      </button>
    </div>
  </form>
</div>
